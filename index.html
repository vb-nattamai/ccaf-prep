      ${Object.entries(DOMAINS).map(([d,D])=>{const x=m[d];const acc=x.n?Math.round(100*x.c/x.n):null;
        return `<div class="drow"><div class="dname"><span class="dot" style="background:var(--d${d})"></span><span>D${d} ${esc(D.name)}</span></div>
        <div class="num">${D.w}%</div>
        <div><div class="meter" title="Accuracy"><i style="width:${acc??0}%;background:var(--d${d})"></i><span class="goal" style="left:72%"></span></div><div class="num" style="margin-top:4px">${acc===null?'not started':acc+'% · '+x.seen+'/'+x.tot}</div></div></div>`}).join('')}
    </div>
    <p class="note" style="margin:0">Middle column is the official exam weight. The tick on each bar marks 72%, roughly the 720 pass line.</p>
    ${last?`<p class="note" style="margin:0">Last mock exam: <b>${last.score}</b> on ${new Date(last.at).toLocaleDateString()} (${last.score>=720?'pass':'below pass'}).</p>`:''}
    <div class="row"><button class="btn ghost" id="reset">Reset progress</button><span class="note" id="rnote"></span></div>
  </section></div>`;
  app.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>go(b.dataset.go));
  let armed=false;$('#reset').onclick=()=>{if(!armed){armed=true;$('#rnote').textContent='Click again to clear all stats and history.';return}
    stats={};hist=[];store.set('stats',stats);store.set('history',hist);store.set('lastResult',null);renderHome();};
}

/* ---------- learn ---------- */
let L = {scen:'all',dom:'all',set:'all',queue:[],i:0,order:null,picked:null,done:0,right:0};
function buildQueue(){
  let q=BANK.filter(x=>(L.scen==='all'||x.s==L.scen)&&(L.dom==='all'||x.d==L.dom));
  if(L.set==='missed')q=q.filter(x=>stats[x.id]&&stats[x.id].last===0);
  if(L.set==='new')q=q.filter(x=>!stats[x.id]);
  L.queue=shuffle(q).map(x=>x.id);L.i=0;L.done=0;L.right=0;newOrder();
}
function newOrder(){L.order=shuffle([0,1,2,3]);L.picked=null;}
function renderLearn(){
  if(!L.queue.length&&L.done===0)buildQueue();
  const opt=(v,t,cur)=>`<option value="${v}"${String(cur)===String(v)?' selected':''}>${esc(t)}</option>`;
  const missedN=BANK.filter(x=>stats[x.id]&&stats[x.id].last===0).length;
  let body;
  if(L.i>=L.queue.length){
    body=L.queue.length?`<div class="panel stack"><h2>Set complete</h2><p style="margin:0">You answered ${L.right} of ${L.done} correctly. ${missedN?`${missedN} questions are in your missed pile.`:''}</p><div class="row"><button class="btn primary" id="again">Shuffle and go again</button>${missedN?'<button class="btn" id="tomissed">Drill missed questions</button>':''}</div></div>`
      :`<div class="empty">No questions match these filters${L.set==='missed'?'. Nothing missed yet.':'.'}</div>`;
  } else {
    const q=BANK[L.queue[L.i]];const S=SCENARIOS[q.s];const pk=L.picked;
    const opts=L.order.map((oi,pos)=>{let cls='opt';if(pk!==null){if(oi===q.a)cls+=' right';else if(oi===pk)cls+=' wrong'}
      return `<li><button class="${cls}" data-oi="${oi}" ${pk!==null?'disabled':''}><span class="L">${LETTERS[pos]}</span><span>${fmt(q.o[oi])}</span></button></li>`}).join('');
    const ok=pk===q.a;
    const fb=pk===null?'':`<div class="feedback" aria-live="polite">
      <div class="verdict ${ok?'ok':'no'}">${ok?'Correct.':'Not quite. The answer is '+LETTERS[L.order.indexOf(q.a)]+'.'}</div>
      <p><span class="lab">Why this answer</span>${fmt(q.e)}</p>
      <p><span class="lab">Why the others fail</span>${fmt(q.w)}</p>
      <div class="rule"><span class="lab" style="color:var(--accent)">Exam pattern</span>${fmt(q.p)}</div>
      <div class="row" style="justify-content:space-between"><button class="btn primary" id="next">Next question</button><span class="kbd">Enter for next</span></div></div>`;
    body=`<div class="stack">
      <div class="qhead"><span class="eyebrow">Question ${L.i+1} of ${L.queue.length} · ${L.right}/${L.done} right</span>${dchip(q.d)}</div>
      <details class="brief" ${L.i===0||!L.queue[L.i-1]||BANK[L.queue[L.i-1]].s!==q.s?'open':''}><summary>Scenario ${q.s}: ${esc(S.name)}</summary><p>${fmt(S.brief)}</p></details>
      <p class="stem">${fmt(q.q)}</p>
      <ol class="opts">${opts}</ol>${pk===null?'<span class="kbd">Press 1 to 4 or A to D to answer</span>':''}${fb}</div>`;
  }
  app.innerHTML=`<div class="stack">
    <div><div class="eyebrow">Learn mode</div><h1 style="margin-top:8px">Study with explanations</h1></div>
    <div class="filters">
      <label>Scenario<select id="fs">${opt('all','All six scenarios',L.scen)}${Object.entries(SCENARIOS).map(([k,v])=>opt(k,k+'. '+v.name,L.scen)).join('')}</select></label>
      <label>Domain<select id="fd">${opt('all','All domains',L.dom)}${Object.entries(DOMAINS).map(([k,v])=>opt(k,'D'+k+' '+v.short+' ('+v.w+'%)',L.dom)).join('')}</select></label>
      <label>Questions<select id="fx">${opt('all','All questions',L.set)}${opt('new','Not yet attempted',L.set)}${opt('missed','Missed last time ('+missedN+')',L.set)}</select></label>
    </div>${body}</div>`;
  const re=()=>{L.scen=$('#fs').value;L.dom=$('#fd').value;L.set=$('#fx').value;L.done=0;buildQueue();renderLearn();};
  $('#fs').onchange=re;$('#fd').onchange=re;$('#fx').onchange=re;
  app.querySelectorAll('.opt:not([disabled])').forEach(b=>b.onclick=()=>pickLearn(+b.dataset.oi));
  const n=$('#next');if(n){n.onclick=nextLearn;n.focus({preventScroll:true});}
  const ag=$('#again');if(ag)ag.onclick=()=>{L.done=0;buildQueue();renderLearn();};
  const tm=$('#tomissed');if(tm)tm.onclick=()=>{L.set='missed';L.scen='all';L.dom='all';L.done=0;buildQueue();renderLearn();};
}
function pickLearn(oi){if(L.picked!==null)return;const q=BANK[L.queue[L.i]];L.picked=oi;L.done++;const ok=oi===q.a;if(ok)L.right++;record(q.id,ok);renderLearn();
  const f=document.querySelector('.feedback');if(f)f.scrollIntoView({block:'nearest'});}
function nextLearn(){L.i++;newOrder();renderLearn();window.scrollTo(0,0);}

/* ---------- exam ---------- */
let E=null, tick=null;
function loadExam(){if(E)return E;const e=store.get('exam',null);if(e&&!e.done){E=e;return E}return null}
function saveExam(){store.set('exam',E)}
function startExam(){
  const scen=shuffle(Object.keys(SCENARIOS)).slice(0,4).map(Number).sort((a,b)=>a-b);
  const items=[];scen.forEach(s=>shuffle(BANK.filter(q=>q.s===s)).slice(0,15).forEach(q=>items.push({id:q.id,order:shuffle([0,1,2,3]),pick:null,flag:false})));
  E={scen,items,cur:0,started:Date.now(),left:EXAM_SECONDS,done:false,confirm:false,showGrid:false};saveExam();renderExam();
}
function remaining(){return E.left-Math.floor((Date.now()-E.started)/1000)}
function renderExam(){
  clearInterval(tick);
  if(!loadExam()){
    const res=store.get('lastResult',null);
    app.innerHTML=`<div class="stack"><div><div class="eyebrow">Exam mode</div><h1 style="margin-top:8px">Full mock exam</h1>
    <p class="lede">Four scenarios drawn at random, 15 questions each. 120 minutes. No feedback until you submit. Your answers are kept in this browser if you close the tab.</p></div>
    <div class="panel stack"><h3>Before you start</h3>
    <ul style="margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px">
      <li>Read the scenario brief once. Every question in that block assumes it.</li>
      <li>Flag questions you want to revisit. Unanswered questions count as wrong.</li>
      <li>Keys: 1 to 4 answer, F flags, arrow keys move between questions.</li>
      <li>The scaled score here is linear (100 + 900 × share correct). Anthropic's own scaling is not published.</li>
    </ul><div class="row"><button class="btn primary" id="go">Start the exam</button></div></div>
    ${res?`<button class="btn ghost" id="lastres" style="align-self:flex-start">Review last result (${res.score})</button>`:''}</div>`;
    $('#go').onclick=startExam;const lr=$('#lastres');if(lr)lr.onclick=()=>renderResults(res);return;
  }
  if(remaining()<=0){submitExam();return;}
  const it=E.items[E.cur];const q=BANK[it.id];const S=SCENARIOS[q.s];
  const answered=E.items.filter(x=>x.pick!==null).length;
  const blockIdx=E.scen.indexOf(q.s)+1;
  const firstOfBlock=E.cur===0||BANK[E.items[E.cur-1].id].s!==q.s;
  const opts=it.order.map((oi,pos)=>`<li><button class="opt${it.pick===oi?' sel':''}" data-oi="${oi}" aria-pressed="${it.pick===oi}"><span class="L">${LETTERS[pos]}</span><span>${fmt(q.o[oi])}</span></button></li>`).join('');
  let grid='';let lastS=null;E.items.forEach((x,i)=>{const s=BANK[x.id].s;if(s!==lastS){grid+=`<span class="sep">Scenario ${E.scen.indexOf(s)+1} · ${esc(SCENARIOS[s].name)}</span>`;lastS=s}
    grid+=`<button data-jump="${i}" class="${x.pick!==null?'ans':''}${x.flag?' flg':''}${i===E.cur?' cur':''}" aria-label="Question ${i+1}">${i+1}</button>`});
  const unanswered=E.items.length-answered, flagged=E.items.filter(x=>x.flag).length;
  app.innerHTML=`<div class="stack">
    <div class="status"><span class="timer" id="timer">${mmss(remaining())}</span><div class="prog" aria-label="${answered} of 60 answered"><i style="width:${answered/E.items.length*100}%"></i></div><span class="num">${answered}/60 answered</span><button class="btn ghost" id="tg">${E.showGrid?'Hide':'Show'} overview</button></div>
    ${E.showGrid?`<div class="panel"><div class="grid">${grid}</div><p class="note" style="margin:10px 0 0">Filled: answered. Dot: flagged.</p></div>`:''}
    <div class="qhead"><span class="eyebrow">Question ${E.cur+1} of 60</span><span class="chip">Scenario ${blockIdx} of 4</span></div>
    <details class="brief" ${firstOfBlock?'open':''}><summary>${esc(S.name)}</summary><p>${fmt(S.brief)}</p></details>
    <p class="stem">${fmt(q.q)}</p>
    <ol class="opts">${opts}</ol>
    <div class="row" style="justify-content:space-between">
      <div class="row"><button class="btn" id="prev" ${E.cur===0?'disabled':''}>Previous</button><button class="btn flagbtn" id="flag" aria-pressed="${it.flag}">${it.flag?'Flagged':'Flag'}</button></div>
      <div class="row">${E.cur<59?'<button class="btn primary" id="nx">Next</button>':''}<button class="btn${E.cur===59?' primary':''}" id="sub">Submit exam</button></div>
    </div>
    ${E.confirm?`<div class="confirm" role="alertdialog" aria-label="Confirm submission"><b style="font-family:var(--f-display)">Submit now?</b><span>${unanswered?unanswered+' unanswered (scored as wrong). ':''}${flagged?flagged+' flagged. ':''}${!unanswered&&!flagged?'Every question is answered.':''}</span><div class="row"><button class="btn primary" id="yes">Submit and score</button><button class="btn" id="no">Keep working</button></div></div>`:''}
  </div>`;
  app.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{it.pick=+b.dataset.oi;saveExam();renderExam();});
  app.querySelectorAll('[data-jump]').forEach(b=>b.onclick=()=>{E.cur=+b.dataset.jump;E.confirm=false;saveExam();renderExam();});
  $('#tg').onclick=()=>{E.showGrid=!E.showGrid;saveExam();renderExam();};
  $('#prev').onclick=()=>move(-1);const nx=$('#nx');if(nx)nx.onclick=()=>move(1);
  $('#flag').onclick=()=>{it.flag=!it.flag;saveExam();renderExam();};
  $('#sub').onclick=()=>{E.confirm=true;renderExam();const c=document.querySelector('.confirm');if(c)c.scrollIntoView({block:'nearest'})};
  const y=$('#yes');if(y){y.onclick=submitExam;$('#no').onclick=()=>{E.confirm=false;renderExam();}}
  tick=setInterval(()=>{const r=remaining();const t=$('#timer');if(!t){clearInterval(tick);return}
    t.textContent=mmss(r);t.classList.toggle('low',r<600);if(r<=0){clearInterval(tick);submitExam();}},1000);
}
function move(d){E.cur=Math.min(59,Math.max(0,E.cur+d));E.confirm=false;saveExam();renderExam();window.scrollTo(0,0);}
function submitExam(){
  clearInterval(tick);
  const rows=E.items.map(x=>{const q=BANK[x.id];const ok=x.pick===q.a;if(x.pick!==null)record(q.id,ok);return {id:x.id,order:x.order,pick:x.pick,ok}});
  const c=rows.filter(r=>r.ok).length;
  const res={at:Date.now(),scen:E.scen,rows,correct:c,score:scaled(c,rows.length),used:Math.min(EXAM_SECONDS,Math.floor((Date.now()-E.started)/1000))};
  hist.push({at:res.at,score:res.score});store.set('history',hist);store.set('lastResult',res);
  E.done=true;store.set('exam',null);E=null;renderResults(res);
}
function renderResults(res){
  const by={};for(const d in DOMAINS)by[d]={c:0,t:0};const bs={};
  res.rows.forEach(r=>{const q=BANK[r.id];by[q.d].t++;if(r.ok)by[q.d].c++;bs[q.s]=bs[q.s]||{c:0,t:0};bs[q.s].t++;if(r.ok)bs[q.s].c++;});
  const pass=res.score>=720;
  const weak=Object.entries(by).filter(([d,x])=>x.t&&x.c/x.t<0.72).sort((a,b)=>a[1].c/a[1].t-b[1].c/b[1].t);
  const pctScore=(res.score-100)/900*100;
  app.innerHTML=`<div class="stack">
    <div><div class="eyebrow">Exam result · ${new Date(res.at).toLocaleString()}</div></div>
    <div class="panel stack"><div class="score"><span class="big">${res.score}</span><div class="stack" style="gap:8px"><span class="pass ${pass?'y':'n'}">${pass?'PASS':'BELOW PASS'}</span><span class="note">${res.correct} of ${res.rows.length} correct · ${mmss(res.used)} used</span></div></div>
    <div class="scale" aria-hidden="true"><i style="width:${pctScore}%"></i><span class="cut" style="left:${(720-100)/9}%"><span>720</span></span></div></div>
    <section class="panel stack"><h2>By domain</h2><div class="blue">${Object.entries(DOMAINS).map(([d,D])=>{const x=by[d];const p=x.t?Math.round(100*x.c/x.t):0;
      return `<div class="drow"><div class="dname"><span class="dot" style="background:var(--d${d})"></span><span>D${d} ${esc(D.short)}</span></div><div class="num">${x.c}/${x.t}</div><div><div class="meter"><i style="width:${p}%;background:var(--d${d})"></i><span class="goal" style="left:72%"></span></div><div class="num" style="margin-top:4px">${x.t?p+'%':'none'}</div></div></div>`}).join('')}</div>
      <p class="note" style="margin:0">Scenarios: ${Object.entries(bs).map(([s,x])=>esc(SCENARIOS[s].name)+' '+x.c+'/'+x.t).join(' · ')}</p>
      ${weak.length?`<div class="row"><span class="note">Focus next on ${weak.map(([d])=>'D'+d+' '+esc(DOMAINS[d].short)).join(', ')}.</span><button class="btn primary" id="drill">Drill ${esc(DOMAINS[weak[0][0]].short)} in Learn mode</button></div>`:''}
    </section>
    <section class="stack"><div class="row" style="justify-content:space-between"><h2>Review answers</h2><div class="row"><button class="btn" data-f="all">All</button><button class="btn" data-f="wrong">Wrong only</button></div></div>
    <div class="rev" id="rev"></div></section>
    <div class="row"><button class="btn primary" id="newx">Start a new exam</button><button class="btn" id="home">Back to home</button></div></div>`;
  const draw=f=>{$('#rev').innerHTML=res.rows.map((r,i)=>({r,i})).filter(({r})=>f==='all'||!r.ok).map(({r,i})=>{const q=BANK[r.id];
    const yours=r.pick===null?'No answer':LETTERS[r.order.indexOf(r.pick)]+'. '+fmt(q.o[r.pick]);
    return `<details><summary><span class="m ${r.ok?'ok':'no'}">${r.ok?'✓':'✗'}</span><span>${i+1}. ${fmt(q.q)}</span></summary><div class="body">
      ${dchip(q.d)}
      <p><span class="eyebrow">Your answer</span><br>${yours}</p>
      <p><span class="eyebrow">Correct</span><br>${LETTERS[r.order.indexOf(q.a)]}. ${fmt(q.o[q.a])}</p>
      <p>${fmt(q.e)}</p><p class="note">${fmt(q.w)}</p><div class="rule">${fmt(q.p)}</div></div></details>`}).join('')||'<div class="empty">No wrong answers. Well done.</div>'};
  draw('wrong');app.querySelectorAll('[data-f]').forEach(b=>b.onclick=()=>draw(b.dataset.f));
  $('#newx').onclick=()=>{startExam();go('exam')};$('#home').onclick=()=>go('home');
  const dr=$('#drill');if(dr)dr.onclick=()=>{L.dom=weak[0][0];L.scen='all';L.set='all';L.done=0;buildQueue();go('learn')};
  window.scrollTo(0,0);
}

/* ---------- patterns ---------- */
function renderPatterns(){
  app.innerHTML=`<div class="stack"><div><div class="eyebrow">Patterns</div><h1 style="margin-top:8px">The rules behind the answers</h1>
  <p class="lede">Each question teaches one decision rule. Read these before a mock exam. The domain weight shows how much each block counts.</p></div>
  ${Object.entries(DOMAINS).map(([d,D])=>{const ps=[...new Set(BANK.filter(q=>q.d==d).map(q=>q.p))];
    return `<section class="panel stack"><div class="row" style="justify-content:space-between"><h2 style="display:flex;gap:10px;align-items:center"><span class="dot" style="background:var(--d${d});width:12px;height:12px"></span>D${d} ${esc(D.name)}</h2><span class="chip">${D.w}% of exam</span></div>
    <ul class="pat">${ps.map(p=>`<li>${fmt(p)}<span>${BANK.filter(q=>q.p===p).map(q=>'S'+q.s).join(' ')}</span></li>`).join('')}</ul></section>`}).join('')}</div>`;
}

/* ---------- keyboard ---------- */
document.addEventListener('keydown',e=>{
  if(e.target.tagName==='SELECT'||(e.key==='Enter'&&e.target.tagName==='BUTTON')||e.metaKey||e.ctrlKey||e.altKey)return;
  const k=e.key.toLowerCase();const idx='1234'.indexOf(k)>=0?'1234'.indexOf(k):'abcd'.indexOf(k);
  if(view==='learn'&&L.i<L.queue.length){
    if(idx>=0&&L.picked===null){pickLearn(L.order[idx]);e.preventDefault();}
    else if(k==='enter'&&L.picked!==null){nextLearn();e.preventDefault();}
  } else if(view==='exam'&&E&&!E.done&&document.querySelector('.timer')){
    const it=E.items[E.cur];
    if(idx>=0){it.pick=it.order[idx];saveExam();renderExam();e.preventDefault();}
    else if(k==='f'){it.flag=!it.flag;saveExam();renderExam();}
    else if(k==='arrowright'){move(1);e.preventDefault();}
    else if(k==='arrowleft'){move(-1);e.preventDefault();}
  }
});

const h=(location.hash||'').slice(1);go(['learn','exam','patterns'].includes(h)?h:'home');
})();
</script>

</body></html>
